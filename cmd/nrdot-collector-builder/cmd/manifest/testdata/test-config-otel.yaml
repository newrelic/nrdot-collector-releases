# This config is for testing purposes and should not be used in production.
#

dist:
  module: github.com/newrelic/nrdot-collector-releases/nrdot-collector
  name: nrdot-collector
  description: NRDOT Collector
  version: 1.1.0
  output_path: ./_build

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/nopreceiver v0.160.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/filelogreceiver v0.160.0
processors:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/k8sattributesprocessor v0.160.0
exporters:
  - gomod: go.opentelemetry.io/collector/exporter/nopexporter v0.160.0
providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.66.0
