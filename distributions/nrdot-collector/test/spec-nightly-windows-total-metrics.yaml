description: |
  nrdot-collector E2E Nightly regression test to validate no additional host metrics have been added.
  Expected to run as a followup to spec-nightly-windows to guarantee presence of expected host metrics.

scenarios:
  - description: windows - validate total number of host metrics
    tests:
      nrqls:
        - query: FROM Metric SELECT uniqueCount(metricName) AS metrics_count
          expected_results:
            - key: metrics_count
              value: 17
